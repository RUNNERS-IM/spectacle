[package]
name = "split-core"
version = "0.1.0"
description = "Window position math and history shared by every Split desktop platform"
authors = ["RUNNERS-IM"]
license-file = "../../LICENSE.md"
edition = "2021"

[dependencies]
# Why: the macOS app's window math lives in JavaScript; running the same files keeps both apps in step.
rquickjs = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
