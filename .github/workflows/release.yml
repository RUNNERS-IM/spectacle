# master 를 release 브랜치로 합치면 직접 배포 판을 낸다. 센스·푸딩과 같은 방식:
# 1) 버전을 출시일 기준 2.{연도 끝자리}.{MMDD} 로 올려 release 에 커밋한다([skip ci]),
# 2) 서명·공증해 GitHub Releases(태그 v<버전>)·appcast 에 올린다. 사용자에게는 자동 업데이트로 바로 간다.
# Homebrew 는 RUNNERS-IM/homebrew-tap 의 워크플로가 최신 릴리스를 보고 따라 고친다.
#
# 러너: 저장소 변수 SPLIT_RUNNER 가 'mac-studio' 면 사무실 Mac Studio(라벨 split-release),
# 아니면 GitHub 호스팅 macos-26. 서명 키는 어느 쪽이든 GitHub Secrets 로 이 실행 동안만 쓰는
# 임시 키체인을 만들고 끝나면 지운다. 러너 맥의 로그인 키체인·파일은 건드리지 않는다.
#
# 손으로 돌릴 때(workflow_dispatch) publish 를 끄면 버전을 올리지 않고 서명·공증까지만 해서
# 결과를 실행 기록 첨부로만 남긴다. 아무에게도 배포되지 않으니 러너·서명 시험에 쓴다.
# App Store 업로드는 저장소 변수 APP_STORE_UPLOAD 가 'true' 일 때만 한다. 심사 제출은 사람이 한다.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      publish:
        description: "버전을 올리고 배포하기 (끄면 시험 실행)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: split-release
  cancel-in-progress: false

jobs:
  release:
    # 버전 올림 커밋이 다시 이 워크플로를 부르지 않게 막는다
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ${{ vars.SPLIT_RUNNER == 'mac-studio' && fromJSON('["self-hosted","split-release"]') || 'macos-26' }}
    timeout-minutes: 60
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0  # the build number is the commit count, and tags tell which versions exist

      - name: Bump the version and push
        id: bump
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          VERSION=$(scripts/bump-release.sh)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Split/Supporting Files/Info.plist"
          # 멈춘 배포를 다시 돌리면 버전이 이미 올라가 있다. 바뀐 게 없으면 커밋을 건너뛴다.
          git diff --cached --quiet || git commit -q -m "Split $VERSION [skip ci]"
          git push origin HEAD:release
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pick the version of a test run
        id: current
        if: env.PUBLISH != 'true'
        run: echo "version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' 'Split/Supporting Files/Info.plist')" >> "$GITHUB_OUTPUT"

      - name: Prepare a temporary signing keychain
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SECRETS="$RUNNER_TEMP/split-secrets"
          mkdir -p "$SECRETS" && chmod 700 "$SECRETS"
          KEYCHAIN="$RUNNER_TEMP/split-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          # The search list is put back as it was when the run ends.
          security list-keychains -d user | tr -d '" ' > "$SECRETS/keychains-before"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$SECRETS/developer-id.p12"
          security import "$SECRETS/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(cat "$SECRETS/keychains-before")
          rm "$SECRETS/developer-id.p12"
          printf '%s' "$ASC_API_KEY_P8" > "$SECRETS/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" > "$SECRETS/sparkle_eddsa_private.key"
          chmod 600 "$SECRETS/"*
          xcrun notarytool store-credentials runners --key "$SECRETS/AuthKey_${ASC_API_KEY_ID}.p8" \
            --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID" --keychain "$KEYCHAIN"
          echo "NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SPARKLE_KEY_FILE=$SECRETS/sparkle_eddsa_private.key" >> "$GITHUB_ENV"

      - name: Release (sign, notarize, publish)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version || steps.current.outputs.version }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            scripts/release.sh "$VERSION" --publish
          else
            scripts/release.sh "$VERSION"
          fi

      - name: Keep the files of a test run
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: split-${{ steps.current.outputs.version }}-test
          path: |
            build/release/*/Split-*.dmg
            build/release/*/appcast.xml
          retention-days: 3

      - name: Upload the App Store build
        if: env.PUBLISH == 'true' && vars.APP_STORE_UPLOAD == 'true'
        run: scripts/release-app-store.sh "${{ steps.bump.outputs.version }}"

      - name: Remove the temporary keychain and keys
        if: always()
        run: |
          SECRETS="$RUNNER_TEMP/split-secrets"
          if [ -f "$SECRETS/keychains-before" ]; then
            security list-keychains -d user -s $(cat "$SECRETS/keychains-before")
          fi
          security delete-keychain "$RUNNER_TEMP/split-signing.keychain-db" 2>/dev/null || true
          rm -rf "$SECRETS"
