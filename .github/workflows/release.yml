# master 를 release 브랜치로 합치면 배포 판을 낸다(태그 v<버전>). 센스 · 푸딩 · Monitor 와 같은 방식:
# 1) 버전을 출시일 기준 2.{연도 끝자리}.{MMDD} 로 올려 release 에 커밋한다([skip ci]),
# 2) 네이티브 모듈(app/native/, napi-rs)을 OS 마다 빌드하고 electron-builder 로 macOS(유니버설) · 윈도우 · 리눅스
#    판을 만들어 GitHub Releases(태그 v<버전>)에 올린다. electron-updater 가 읽는 latest-mac.yml · latest.yml ·
#    latest-linux.yml 도 같이 올린다.
# 3) 예전 맥 판(Objective-C, Sparkle)이 읽는 appcast.xml 도 같이 올린다. 그 판은 runners.im/split/appcast.xml →
#    releases/latest/download/appcast.xml 을 읽고 이 판의 zip 을 받아 스스로 바꿔 끼운다.
# Homebrew 는 RUNNERS-IM/homebrew-tap 의 워크플로가 최신 릴리스를 보고 따라 고친다.
#
# macOS 는 Developer ID 로 서명 · 공증한다. 서명 키는 저장소 비밀값에서 이 실행 동안만 쓰는 임시 키체인에 넣고
# 끝나면 지운다. 윈도우는 코드 서명 인증서가 없어 서명하지 않는다(처음 열 때 SmartScreen 경고가 뜬다).
# App Store 판은 아직 예전 맥 판(Split.xcodeproj, scripts/release-app-store.sh)으로 사람이 올린다.
#
# 손으로 돌릴 때(workflow_dispatch) publish 를 끄면 버전을 올리지 않고 빌드 · 서명 · 공증까지만 해서
# 결과를 실행 기록 첨부로만 남긴다. 아무에게도 배포되지 않으니 빌드 시험에 쓴다.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      publish:
        description: "버전을 올리고 배포하기 (끄면 시험 실행)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: split-release
  cancel-in-progress: false

env:
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  version:
    # 버전 올림 커밋이 다시 이 워크플로를 부르지 않게 막는다
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.bump.outputs.version || steps.current.outputs.version }}
      sha: ${{ steps.bump.outputs.sha || github.sha }}
      build_number: ${{ steps.count.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLISH == 'true' && 'release' || github.ref }}
          fetch-depth: 0  # 태그로 같은 날 낸 버전이 있는지 보고, 커밋 수로 빌드 번호를 정한다

      - name: Bump the version and push
        id: bump
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          BUMPED=$(scripts/bump-release.sh)
          VERSION=$(echo "$BUMPED" | sed -n 1p)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package.json app/native/Cargo.toml
          # 멈춘 배포를 다시 돌리면 버전이 이미 올라가 있다. 바뀐 게 없으면 커밋을 건너뛴다.
          git diff --cached --quiet || git commit -q -m "Split $VERSION [skip ci]"
          git push origin HEAD:release
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pick the version of a test run
        id: current
        if: env.PUBLISH != 'true'
        run: echo "version=$(jq -r .version app/package.json | tr + .)-test" >> "$GITHUB_OUTPUT"

      # 예전 맥 판의 Sparkle 은 CFBundleVersion(커밋 수, 2.6.1030.10 은 789)을 비교한다. 더 작으면 업데이트로 안 보인다.
      - name: Count the build number
        id: count
        run: |
          set -euo pipefail
          COUNT=$(git rev-list --count HEAD)
          [ "$COUNT" -gt 789 ] || { echo "빌드 번호 $COUNT 이 예전 맥 판(789)보다 크지 않습니다." >&2; exit 1; }
          echo "build_number=$COUNT" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-26
            builder: --mac
          - os: windows
            runner: windows-latest
            builder: --win
          - os: linux
            runner: ubuntu-22.04  # 오래된 glibc 로 빌드해야 더 많은 배포판에서 켜진다
            builder: --linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # 파일 이름은 앱 버전(2.6.1031+2) 대신 태그 모양(2.6.1031.2)을 쓴다 (app/builder.config.cjs)
      SPLIT_TAG: ${{ needs.version.outputs.version }}
      SPLIT_BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/app/native/target.noindex
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/native -> target.noindex

      - name: Install the Linux packaging tools
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: pnpm install --frozen-lockfile

      # 맥은 Apple silicon 과 Intel 판을 한 파일(split-native.darwin-universal.node)로 합친다.
      - name: Build the native module
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = macos ]; then pnpm native:mac-universal; else pnpm native; fi
          ls -la native/*.node

      - run: pnpm build

      - name: Prepare a temporary signing keychain
        if: matrix.os == 'macos'
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SECRETS="$RUNNER_TEMP/split-secrets"
          mkdir -p "$SECRETS" && chmod 700 "$SECRETS"
          KEYCHAIN="$RUNNER_TEMP/split-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          # The search list is put back as it was when the run ends.
          security list-keychains -d user | tr -d '" ' > "$SECRETS/keychains-before"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$SECRETS/developer-id.p12"
          security import "$SECRETS/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(cat "$SECRETS/keychains-before")
          rm "$SECRETS/developer-id.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"
          printf '%s' "$ASC_API_KEY_P8" > "$SECRETS/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" > "$SECRETS/sparkle_eddsa_private.key"
          chmod 600 "$SECRETS/"*
          echo "APPLE_API_KEY_PATH=$SECRETS/AuthKey_${ASC_API_KEY_ID}.p8" >> "$GITHUB_ENV"
          echo "SPARKLE_KEY_FILE=$SECRETS/sparkle_eddsa_private.key" >> "$GITHUB_ENV"

      # macOS 에서는 위 키체인의 Developer ID 로 서명하고(CSC_NAME), APPLE_API_* 로 앱을 공증한다.
      # 올리기는 publish 작업이 한꺼번에 하므로 여기서는 --publish never.
      - name: Build the app
        shell: bash
        env:
          SPLIT_RELEASE: ${{ matrix.os == 'macos' && '1' || '' }}
          CSC_NAME: ${{ matrix.os == 'macos' && 'Runners Co., Ltd (RGWVXJ8URP)' || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos' && 'true' || 'false' }}
          APPLE_API_KEY_ID: ${{ matrix.os == 'macos' && secrets.ASC_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos' && secrets.ASC_API_ISSUER_ID || '' }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = macos ]; then export APPLE_API_KEY="$APPLE_API_KEY_PATH"; fi
          pnpm exec electron-builder --config builder.config.cjs ${{ matrix.builder }} --publish never

      # 앱은 electron-builder 가 공증했지만 DMG 자체도 공증 · 스테이플해야 오프라인에서도 경고 없이 열린다
      - name: Notarize the DMG
        if: matrix.os == 'macos'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for DMG in dist.noindex/*.dmg; do
            xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID" --wait
            xcrun stapler staple "$DMG"
            spctl -a -t open --context context:primary-signature -v "$DMG"
          done

      # 다리: 예전 맥 판(Sparkle 2.10.1)이 읽는 appcast.xml. 같은 zip 을 Sparkle 열쇠(EdDSA)로 서명해 적는다.
      # 예전 맥 판이 하나도 남지 않으면 이 단계를 지워도 된다.
      - name: Write appcast.xml for installed copies of the previous Mac app
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          ZIP="dist.noindex/Split-$VERSION-mac.zip"
          SIGNED=$("$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file "$SPARKLE_KEY_FILE" "$ZIP")
          cat > dist.noindex/appcast.xml <<EOF
          <?xml version="1.0" standalone="yes"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">
              <channel>
                  <title>Split</title>
                  <item>
                      <title>$VERSION</title>
                      <pubDate>$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                      <sparkle:version>$SPLIT_BUILD_NUMBER</sparkle:version>
                      <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                      <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                      <enclosure url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/Split-$VERSION-mac.zip" type="application/octet-stream" $SIGNED/>
                  </item>
              </channel>
          </rss>
          EOF
          xmllint --noout dist.noindex/appcast.xml
          cat dist.noindex/appcast.xml

      - name: Collect the files
        shell: bash
        run: |
          set -euo pipefail
          OUT=dist-release && mkdir -p $OUT
          shopt -s nullglob
          for f in dist.noindex/*.{dmg,zip,exe,AppImage,deb,rpm,blockmap,yml,xml}; do
            case "$(basename "$f")" in builder-debug.yml|builder-effective-config.yaml) continue ;; esac
            cp "$f" "$OUT/"
          done
          # 홈페이지의 받기 단추는 releases/latest/download/<이름> 으로 바로 받는다. 그래서 버전 없는 이름으로도
          # 한 벌 올린다. 자동 업데이트(latest*.yml)와 Homebrew 는 버전 붙은 파일을 쓴다.
          case "${{ matrix.os }}" in
            macos) cp "dist.noindex/Split-$VERSION.dmg" "$OUT/split-macos.dmg" ;;
            windows) cp "dist.noindex/Split-$VERSION-windows-x64-setup.exe" "$OUT/split-windows-x64-setup.exe" ;;
            linux) cp "dist.noindex/Split-$VERSION-linux-x86_64.AppImage" "$OUT/split-linux-x86_64.AppImage"
                   cp "dist.noindex/Split-$VERSION-linux-amd64.deb" "$OUT/split-linux-amd64.deb" ;;
          esac
          ls -la $OUT

      - uses: actions/upload-artifact@v4
        with:
          name: split-${{ matrix.os }}
          path: app/dist-release/*
          retention-days: 3

      - name: Remove the temporary keychain and keys
        if: always() && matrix.os == 'macos'
        run: |
          SECRETS="$RUNNER_TEMP/split-secrets"
          if [ -f "$SECRETS/keychains-before" ]; then
            security list-keychains -d user -s $(cat "$SECRETS/keychains-before")
          fi
          security delete-keychain "$RUNNER_TEMP/split-signing.keychain-db" 2>/dev/null || true
          rm -rf "$SECRETS"

  publish:
    needs: [version, build]
    if: needs.version.result == 'success' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      # 릴리스 본문은 저장소의 RELEASE_NOTES.md("## 한국어" · "## English" 두 칸의 "- " 목록)다. 앱의 업데이트 창이
      # 이 본문에서 자기 언어 칸의 목록만 읽어 "바뀐 점"으로 보여 준다. 설치 안내는 그 뒤 다른 칸에 붙여서 목록에
      # 섞이지 않게 한다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          path: repo
          sparse-checkout: RELEASE_NOTES.md
          sparse-checkout-cone-mode: false

      - name: Publish the GitHub release
        run: |
          set -euo pipefail
          {
            cat repo/RELEASE_NOTES.md
            printf '\n## Downloads\n\nmacOS (Apple silicon, Intel), Windows, Linux (X11). The Windows installer is not code signed yet, so Windows shows a SmartScreen warning the first time.\n'
          } > body.md
          ls -la files
          gh release create "v$VERSION" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.version.outputs.sha }}" \
            --title "Split $VERSION" \
            --notes-file body.md \
            --latest
