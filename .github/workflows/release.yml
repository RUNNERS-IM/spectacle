# 버전 태그(v1.3 등)를 올리면 직접 배포 판을 서명·공증해 GitHub Releases 에 올린다.
# 1) 사무실 맥 러너(라벨 split-release)가 켜져 있고 놀고 있으면 거기서,
# 2) 아니면 GitHub 호스팅 맥(macos-26)에서 비밀값으로 임시 키체인을 만들어 돈다.
# App Store 업로드는 저장소 변수 APP_STORE_UPLOAD 가 'true' 일 때만 한다. 심사 제출은 사람이 한다.
# 손으로 돌릴 때(workflow_dispatch) publish 를 끄면 서명·공증까지만 하고 결과는 실행 기록의
# 첨부 파일로만 남긴다. 아무에게도 배포되지 않으니 러너·서명 설정 시험에 쓴다.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "버전 (예: 1.3). 해당 태그가 이미 있어야 합니다"
        required: true
      publish:
        description: "GitHub Releases·Homebrew 에 올리기 (끄면 시험 실행)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pick-runner:
    runs-on: ubuntu-latest
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
      hosted: ${{ steps.pick.outputs.hosted }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          online=""
          if [ -n "$GH_TOKEN" ]; then
            online=$(gh api "repos/${{ github.repository }}/actions/runners" \
              --jq '[.runners[] | select(.status=="online" and (.busy|not) and ([.labels[].name] | index("split-release")))] | length' 2>/dev/null || echo 0)
          fi
          if [ "${online:-0}" -gt 0 ]; then
            echo 'runs_on=["self-hosted","split-release"]' >> "$GITHUB_OUTPUT"
            echo 'hosted=false' >> "$GITHUB_OUTPUT"
            echo "사무실 맥 러너에서 실행합니다."
          else
            echo 'runs_on="macos-26"' >> "$GITHUB_OUTPUT"
            echo 'hosted=true' >> "$GITHUB_OUTPUT"
            echo "사무실 맥 러너가 없어 GitHub 호스팅 맥에서 실행합니다."
          fi

  release:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs_on) }}
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the build number is the commit count
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}

      - name: Prepare signing on the hosted Mac
        if: needs.pick-runner.outputs.hosted == 'true'
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/split-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          mkdir -p "$HOME/.runners/secrets"
          printf '%s' "$ASC_API_KEY_P8" > "$HOME/.runners/secrets/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" > "$HOME/.runners/secrets/sparkle_eddsa_private.key"
          chmod 600 "$HOME/.runners/secrets/"*
          xcrun notarytool store-credentials runners --key "$HOME/.runners/secrets/AuthKey_${ASC_API_KEY_ID}.p8" \
            --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID" --keychain "$KEYCHAIN"
          echo "NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Release (sign, notarize, publish)
        env:
          GH_TOKEN: ${{ github.token }}
          # A tag push always publishes; a manual run publishes only when asked.
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            scripts/release.sh "${VERSION#v}" --publish
          else
            scripts/release.sh "${VERSION#v}"
          fi

      - name: Keep the files of a test run
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: split-${{ inputs.version }}-test
          path: |
            build/release/*/Split-*.dmg
            build/release/*/appcast.xml
          retention-days: 3

      - name: Upload the App Store build
        if: (github.event_name == 'push' || inputs.publish) && vars.APP_STORE_UPLOAD == 'true'
        run: scripts/release-app-store.sh "${VERSION#v}"

      - name: Remove the temporary keychain
        if: always() && needs.pick-runner.outputs.hosted == 'true'
        run: security delete-keychain "$RUNNER_TEMP/split-signing.keychain-db" || true
