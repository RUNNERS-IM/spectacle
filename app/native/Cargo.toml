[package]
name = "split-native"
version = "2.6.1101"
description = "Split's one native module: monitors, windows, moving windows, the app in front and modifier keys"
authors = ["RUNNERS-IM"]
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
path = "rs/lib.rs"

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }

[build-dependencies]
cc = "1"
napi-build = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
