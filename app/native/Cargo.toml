[package]
name = "split-native"
version = "2.6.1031"
description = "Split's one native module: monitors, windows, moving windows, the app in front and modifier keys"
authors = ["RUNNERS-IM"]
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
path = "rs/lib.rs"

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[build-dependencies]
napi-build = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
