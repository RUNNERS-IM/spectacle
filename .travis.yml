osx_image: xcode8.2
language: objective-c
xcode_project: Split.xcodeproj
xcode_scheme: Split

before_install:
  - brew update
  - brew outdated carthage || brew upgrade carthage
  - carthage bootstrap --platform Mac

script:
  - set -o pipefail && xcodebuild -project Split.xcodeproj -scheme Split test | xcpretty
